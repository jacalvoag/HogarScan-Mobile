name: Android CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, unit tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      ORG_GRADLE_PROJECT_HOGARSCAN_API_BASE_URL: https://example.invalid/

    steps:
      - name: Obtener el código
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Instalar componentes del SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verificar la aplicación
        run: |
          bash ./gradlew \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            --continue \
            --no-daemon \
            --stacktrace

      - name: Guardar informes
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: android-verification-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*